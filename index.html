<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>Furniture AR Business Card</title>
        <!-- A-Frame & AR.js Libraries -->
        <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe-master.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/fcor/arjs-gestures@master/dist/gestures.js"></script>
    </head>

    <body style="margin: 0px; overflow: hidden;">
        <a-scene
            embedded
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true; colorManagement: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            gesture-detector
        >
            <a-assets>
                <a-asset-item id="chair-model" src="asset.gltf" crossorigin="anonymous"></a-asset-item>
            </a-assets>

            <!-- Scene Lighting -->
            <a-entity light="type: ambient; intensity: 1.6;"></a-entity>
            <a-entity light="type: directional; intensity: 1.2;" position="2 4 3"></a-entity>

            <!-- Marker Tracking with Extended Motion Persistence -->
            <a-marker
                id="furniture-marker"
                type="pattern"
                preset="custom"
                url="marker.patt"
                crossorigin="anonymous"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <!-- 3D Chair Model (50% Increased Base Scale: 1.5) -->
                <a-entity
                    id="chair-entity"
                    position="0 0 0"
                    scale="1.5 1.5 1.5"
                    rotation="0 0 0"
                    gltf-model="#chair-model"
                    class="clickable"
                    gesture-handler="minScale: 0.2; maxScale: 8;"
                >
                    <!-- Label 1: Company Name (Top Back) -->
                    <a-entity position="0 1.2 -0.8" rotation="-30 0 0">
                        <a-plane
                            width="1.6"
                            height="0.3"
                            color="#FFFFFF"
                            material="shader: flat; opacity: 0.95;"
                            geometry="primitive: plane;"
                        >
                            <a-text
                                value="LUXURY COMFORT CO."
                                color="#000000"
                                align="center"
                                position="0 0 0.01"
                                scale="0.35 0.35 0.35"
                                font="dejavu"
                            ></a-text>
                        </a-plane>
                    </a-entity>

                    <!-- Label 2: Product Name & Comfort (Front Center) -->
                    <a-entity position="0 -0.2 0.9" rotation="-45 0 0">
                        <a-plane
                            width="1.8"
                            height="0.32"
                            color="#FFFFFF"
                            material="shader: flat; opacity: 0.95;"
                        >
                            <a-text
                                value="ARMCHAIR | ULTRA ERGONOMIC"
                                color="#000000"
                                align="center"
                                position="0 0 0.01"
                                scale="0.32 0.32 0.32"
                                font="dejavu"
                            ></a-text>
                        </a-plane>
                    </a-entity>

                    <!-- Label 3: Price Tag (Right Side) -->
                    <a-entity position="1.1 0.4 0" rotation="-30 -30 0">
                        <a-plane
                            width="1.1"
                            height="0.3"
                            color="#FFFFFF"
                            material="shader: flat; opacity: 0.95;"
                        >
                            <a-text
                                value="PRICE: $299.99"
                                color="#000000"
                                align="center"
                                position="0 0 0.01"
                                scale="0.35 0.35 0.35"
                                font="dejavu"
                            ></a-text>
                        </a-plane>
                    </a-entity>

                    <!-- Label 4: Material & Finish (Left Side) -->
                    <a-entity position="-1.1 0.4 0" rotation="-30 30 0">
                        <a-plane
                            width="1.4"
                            height="0.3"
                            color="#FFFFFF"
                            material="shader: flat; opacity: 0.95;"
                        >
                            <a-text
                                value="LEATHER & SOLID WOOD"
                                color="#000000"
                                align="center"
                                position="0 0 0.01"
                                scale="0.28 0.28 0.28"
                                font="dejavu"
                            ></a-text>
                        </a-plane>
                    </a-entity>
                </a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
