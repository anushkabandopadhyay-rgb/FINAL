<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>Furniture AR Business Card</title>
        <!-- A-Frame & AR.js Stable Libraries -->
        <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe-master.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/fcor/arjs-gestures@master/dist/gestures.js"></script>

        <style>
            /* Interactive Screen Overlay UI */
            .ar-overlay {
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                width: 85%;
                max-width: 360px;
                background: rgba(20, 20, 20, 0.88);
                backdrop-filter: blur(10px);
                border-radius: 16px;
                padding: 18px 20px;
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                box-shadow: 0 10px 25px rgba(0,0,0,0.4);
                border: 1px solid rgba(255, 255, 255, 0.15);
                display: none;
                z-index: 9999;
                transition: opacity 0.3s ease;
            }

            .ar-overlay h2 {
                margin: 0 0 4px 0;
                font-size: 1.2rem;
                font-weight: 700;
                color: #ffffff;
            }

            .ar-overlay .company {
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #1abc9c;
                margin-bottom: 12px;
                font-weight: 600;
            }

            .info-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                font-size: 0.85rem;
                border-top: 1px solid rgba(255,255,255,0.1);
                padding-top: 10px;
            }

            .info-item span {
                display: block;
                font-size: 0.7rem;
                color: #aaaaaa;
                text-transform: uppercase;
            }

            .info-item strong {
                color: #e0e0e0;
                font-weight: 500;
            }

            .price-tag {
                margin-top: 12px;
                font-size: 1.2rem;
                font-weight: 700;
                color: #f1c40f;
                text-align: right;
            }

            .close-btn {
                position: absolute;
                top: 10px;
                right: 14px;
                background: none;
                border: none;
                color: #aaaaaa;
                font-size: 1.2rem;
                cursor: pointer;
            }
        </style>
    </head>

    <body style="margin: 0px; overflow: hidden;">
        <!-- UI Card Overlay -->
        <div id="infoCard" class="ar-overlay">
            <button class="close-btn" onclick="hideCard()">✕</button>
            <h2 id="cardTitle">Luxury Leather Armchair</h2>
            <div class="company" id="cardCompany">Luxury Comfort Co.</div>
            
            <div class="info-grid">
                <div class="info-item">
                    <span>Comfort Level</span>
                    <strong id="cardComfort">Ultra Ergonomic (Soft)</strong>
                </div>
                <div class="info-item">
                    <span>Material</span>
                    <strong id="cardMaterial">Premium Italian Leather</strong>
                </div>
                <div class="info-item">
                    <span>Finish</span>
                    <strong id="cardFinish">Matte Mahogany</strong>
                </div>
                <div class="info-item">
                    <span>Warranty</span>
                    <strong>5 Years Limited</strong>
                </div>
            </div>

            <div class="price-tag" id="cardPrice">$299.99 - $349.99</div>
        </div>

        <a-scene
            embedded
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true; colorManagement: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            gesture-detector
        >
            <a-assets>
                <a-asset-item id="chair-model" src="asset.gltf" crossorigin="anonymous"></a-asset-item>
            </a-assets>

            <!-- Lighting to make model visible -->
            <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
            <a-entity light="type: directional; intensity: 1;" position="1 4 2"></a-entity>

            <a-marker
                id="furniture-marker"
                type="pattern"
                preset="custom"
                url="marker.patt"
                crossorigin="anonymous"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <!-- 3D Model with Click Listener and Gesture Controls -->
                <a-entity
                    id="chair-entity"
                    position="0 0 0"
                    scale="1 1 1"
                    rotation="0 0 0"
                    gltf-model="#chair-model"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <script>
            // Show/Hide Info Overlay
            function showCard() {
                document.getElementById('infoCard').style.display = 'block';
            }

            function hideCard() {
                document.getElementById('infoCard').style.display = 'none';
            }

            // Trigger details pop-up on model click/tap
            document.addEventListener('DOMContentLoaded', () => {
                const chair = document.getElementById('chair-entity');
                const marker = document.getElementById('furniture-marker');

                chair.addEventListener('click', () => {
                    showCard();
                });

                // Auto hide card when marker disappears from camera view
                marker.addEventListener('markerLost', () => {
                    hideCard();
                });
            });
        </script>
    </body>
</html>
